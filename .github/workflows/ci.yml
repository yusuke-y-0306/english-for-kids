name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: lint / typecheck / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Next.js 16 は LayoutProps / PageProps などのルート型を
      # next build / next dev 時に生成する。tsc 単体だと未生成で
      # "Cannot find name 'LayoutProps'" になるため、先に typegen する。
      - name: Generate route types
        run: npx next typegen
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
