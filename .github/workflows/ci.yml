name: CI

on:
  # base ブランチを限定しない。feature ブランチを積む（stacked PR）場合でも
  # CI を回すため。
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: lint / typecheck / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Next.js 16 は LayoutProps / PageProps などのルート型を
      # next build / next dev 時に生成する。tsc 単体だと未生成で
      # "Cannot find name 'LayoutProps'" になるため、先に typegen する。
      - name: Generate route types
        run: npx next typegen
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      # 音声モデルの manifest が壊れていないか (issue #30)。ネットワークには出ない。
      - name: Check model manifest
        run: npm run models:check
      # 語彙 JSON のスキーマ (issue #83)。ID 重複・必須項目欠落・未知カテゴリは
      # ここで落とす。ビルドでも同じ検証が走るが、失敗位置を先に出す。
      - name: Check vocabulary content
        run: npm run vocabulary:check
      # 単語音声 (issue #84) の欠落・サイズ予算・index.json の一致。
      # 音声は生成済みをコミットしているので、CI はネットワークに出ない。
      - name: Check word audio assets
        run: npm run audio:check
      - name: Build
        run: npm run build
      # 端末内認識エンジン (issue #79) が public/ に配られたか。
      # 13MB はリポジトリに入れないので、ビルド時のコピーが無いと実行時 404 になる。
      - name: Check ASR engine assets
        run: node scripts/asr-engine.mjs --check
      # セキュリティヘッダと CSP (issue #33)。必ず production build (next start) に対して確認する。
      - name: Security headers smoke test
        run: |
          npm run start -- -p 3100 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:3100/login && break
            sleep 1
          done
          BASE_URL=http://127.0.0.1:3100 npm run headers:check
      # 発音判定の単体テスト (issue #2) と、発音結果 API の認可テスト (issue #32)。
      # 後者は一時データディレクトリで実サーバを起動し、未ログイン / 改ざん cookie /
      # 他人の userId を HTTP 越しに確かめる。
      - name: Unit / API tests
        run: npm run test
      # ブラウザ E2E。ビルド済み成果物に対して、実際の画面操作で
      # 「カードをめくる → クイズを1ラウンド → 進捗に出る」までを確かめる。
      # フィクスチャ (署名済みセッション cookie / 専用データディレクトリ) は
      # `npm run test:e2e` の前段 (scripts/e2e/prepare.mjs) が作る。
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: E2E (Playwright)
        run: npm run test:e2e
