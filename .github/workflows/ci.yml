name: CI

on:
  # base ブランチを限定しない。feature ブランチを積む（stacked PR）場合でも
  # CI を回すため。
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: lint / typecheck / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Next.js 16 は LayoutProps / PageProps などのルート型を
      # next build / next dev 時に生成する。tsc 単体だと未生成で
      # "Cannot find name 'LayoutProps'" になるため、先に typegen する。
      - name: Generate route types
        run: npx next typegen
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      # 音声モデルの manifest が壊れていないか (issue #30)。ネットワークには出ない。
      - name: Check model manifest
        run: npm run models:check
      - name: Build
        run: npm run build
      # セキュリティヘッダと CSP (issue #33)。必ず production build (next start) に対して確認する。
      - name: Security headers smoke test
        run: |
          npm run start -- -p 3100 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:3100/login && break
            sleep 1
          done
          BASE_URL=http://127.0.0.1:3100 npm run headers:check
